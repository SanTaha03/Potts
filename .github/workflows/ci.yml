name: CI - DevSecOps

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # 1. Code Quality & Tests
  quality-checks:
    name: 🧪 Quality & Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, intl, pdo, pdo_sqlite, zip
        tools: composer:v2
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Composer dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Install NPM dependencies
      run: npm ci

    - name: 🎨 Run Linter (Pint)
      run: ./vendor/bin/pint --test

    - name: 🏗️ Build Frontend Assets
      run: npm run build

    - name: 🧪 Run Unit Tests (PHPUnit)
      run: ./vendor/bin/phpunit
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: :memory:

  # 2. Security Scans
  security-scans:
    name: 🛡️ Security Scans
    runs-on: ubuntu-latest
    needs: quality-checks
    if: always() # Run even if tests fail, or remove if you want strict blocking
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Secret Scanning
      - name: 🔑 Gitleaks (Secret Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # PHP Dependency Analysis
      - name: 📦 Composer Audit
        run: |
          composer install --no-dev --dry-run
          composer audit

      # JS Dependency Analysis
      - name: 📦 NPM Audit
        run: npm audit --audit-level=high

      # Container/FS Vulnerability Scanning
      - name: 🔍 Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'